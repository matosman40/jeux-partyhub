name: Publier un jeu

# Déclenché de deux façons :
# - par un tag `<jeu>-vX.Y.Z` poussé à la main (exemple : frontieres-v1.2.0) ;
# - par le workflow « Étiqueter les jeux » (workflow_call), qui crée le tag quand un manifeste change sur main.
# Le jeu est le dossier jeux/<jeu>/ ; le numéro du tag doit égaler `version` du manifeste.
on:
  push:
    tags: ['*-v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag à publier, de la forme <jeu>-vX.Y.Z'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Lire le tag
        id: tag
        run: |
          GAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [[ ! "$GAME" =~ ^[a-z0-9][a-z0-9-]{1,47}$ ]]; then
            echo "Identifiant de jeu invalide : $GAME" >&2; exit 1
          fi
          echo "game=$GAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Vérifier le dossier et la version
        run: |
          test -f "jeux/${{ steps.tag.outputs.game }}/manifest.json" || { echo "Dossier jeux/${{ steps.tag.outputs.game }} introuvable." >&2; exit 1; }
          MANIFEST_ID=$(jq -r .id "jeux/${{ steps.tag.outputs.game }}/manifest.json")
          MANIFEST_VERSION=$(jq -r .version "jeux/${{ steps.tag.outputs.game }}/manifest.json")
          [ "$MANIFEST_ID" = "${{ steps.tag.outputs.game }}" ] || { echo "L'identifiant du manifeste ($MANIFEST_ID) doit être ${{ steps.tag.outputs.game }}." >&2; exit 1; }
          [ "$MANIFEST_VERSION" = "${{ steps.tag.outputs.version }}" ] || { echo "Le tag annonce ${{ steps.tag.outputs.version }}, le manifeste $MANIFEST_VERSION." >&2; exit 1; }

      - name: Préparer PartyHub
        env:
          GH_TOKEN: ${{ github.token }}
          PARTYHUB_REF: ${{ vars.PARTYHUB_REF }}
        run: |
          REF="$PARTYHUB_REF"
          if [ -z "$REF" ]; then
            # Sans variable : la dernière release de PartyHub, pour construire le jeu contre la version publiée.
            REF="$(gh api repos/matosman40/partyhub/releases/latest --jq .tag_name)"
          fi
          echo "Construction contre PartyHub $REF"
          git clone --depth 1 --branch "$REF" https://github.com/matosman40/Partyhub.git "$RUNNER_TEMP/partyhub"
          cd "$RUNNER_TEMP/partyhub"
          npm ci --ignore-scripts
          npm run build -w @partyhub/shared
          npm run build -w @partyhub/games
          npm run build -w @partyhub/server

      - name: Construire et vérifier le paquet
        env:
          SIGNING_KEY: ${{ secrets.PHGAME_SIGNING_KEY }}
        run: |
          GAME="${{ steps.tag.outputs.game }}"
          CLI="$RUNNER_TEMP/partyhub/packages/server/dist/cli/phgame.js"
          KIND="$(jq -r .kind "$GITHUB_WORKSPACE/jeux/$GAME/manifest.json")"
          if [ "$KIND" = "code" ]; then
            # Un jeu de code doit être signé : PartyHub refuse un paquet non signé.
            if [ -z "$SIGNING_KEY" ]; then
              echo "Secret PHGAME_SIGNING_KEY absent : un jeu de code doit être signé." >&2; exit 1
            fi
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing.key.pem"
            openssl pkey -in "$RUNNER_TEMP/signing.key.pem" -pubout -out "$RUNNER_TEMP/signing.pub.pem"
            node "$CLI" pack "$GITHUB_WORKSPACE/jeux/$GAME" "$RUNNER_TEMP/$GAME.phgame" "$RUNNER_TEMP/signing.key.pem"
            rm -f "$RUNNER_TEMP/signing.key.pem"
            node "$CLI" check "$RUNNER_TEMP/$GAME.phgame" "$RUNNER_TEMP/signing.pub.pem"
          else
            node "$CLI" pack "$GITHUB_WORKSPACE/jeux/$GAME" "$RUNNER_TEMP/$GAME.phgame"
            node "$CLI" check "$RUNNER_TEMP/$GAME.phgame"
          fi

      - name: Empreinte
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "${{ steps.tag.outputs.game }}.phgame" > "${{ steps.tag.outputs.game }}.phgame.sha256"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GAME="${{ steps.tag.outputs.game }}"
          # Pas de cd : --generate-notes lit l'historique du dépôt courant (l'espace de travail).
          gh release create "$TAG" "$RUNNER_TEMP/$GAME.phgame" "$RUNNER_TEMP/$GAME.phgame.sha256" --title "$GAME ${{ steps.tag.outputs.version }}" --generate-notes
